name: Build GS CINEMATIC APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir android-project
          unzip -q *.zip -d android-project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: android-project
        run: |
          PROJECT_DIR=$(find . -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs dirname)
          cd "$PROJECT_DIR"
          set +e
          gradle assembleDebug --stacktrace --console=plain > build.log 2>&1
          STATUS=$?
          echo "================ ROOT ERROR ================"
          grep -n -A15 -B5 -E "What went wrong|FAILURE:|Caused by:|Could not" build.log || true
          echo "================ LAST LOG ================"
          tail -n 100 build.log
          exit $STATUS

      - name: Find APK
        if: always()
        run: |
          find android-project -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GS-CINEMATIC-APK
          path: android-project/**/*.apk
